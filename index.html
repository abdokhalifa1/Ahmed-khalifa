<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>برنامج الرحلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#00201e;--gold:#cf9e00;--cream:#fff7dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
:root[data-theme="dark"]{--bg:#00201e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Tajawal','Noto Naskh Arabic',sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg) radial-gradient(circle at 50% 40%,#04403a,transparent 70%)}
#deck{touch-action:none;position:relative;width:min(88vw,calc((100dvh - 150px)*.75));aspect-ratio:3/4;container-type:inline-size}
.card{position:absolute;inset:0;border-radius:6cqw;background:var(--c);color:var(--ink);overflow:hidden;will-change:transform;box-shadow:0 2cqw 5cqw rgba(0,0,0,.5);transition:transform .8s cubic-bezier(.25,.6,.25,1),opacity .7s;cursor:grab;touch-action:none}
.card:before{content:"";position:absolute;inset:3cqw;border:.35cqw dashed var(--ink);opacity:.22;border-radius:4cqw;pointer-events:none}
.n{position:absolute;left:6cqw;top:3cqw;font:300 22cqw/1 'Tajawal',sans-serif;color:var(--ink);opacity:.16}
.po{position:absolute;z-index:1;background:#f6f2e8;padding:2.4cqw 2.4cqw 8cqw;box-shadow:0 1.4cqw 3.4cqw rgba(0,0,0,.4);transition:transform .4s cubic-bezier(.3,1.5,.5,1),box-shadow .3s;cursor:zoom-in}.po.zoom{transform:rotate(0) scale(1.35);z-index:6;box-shadow:0 3cqw 7cqw rgba(0,0,0,.6);cursor:zoom-out}
.po img,.po svg{display:block;width:100%;aspect-ratio:1;object-fit:cover;pointer-events:none}
.p0{left:26cqw;top:7cqw;width:48cqw;transform:rotate(-4deg)}
.p1{right:8cqw;top:6cqw;width:38cqw;transform:rotate(5deg)}
.p2{left:8cqw;top:19cqw;width:38cqw;transform:rotate(-4deg)}
.dt{position:absolute;left:6cqw;bottom:6cqw;width:24cqw;height:12cqw;background:radial-gradient(var(--ink) .35cqw,transparent .5cqw) 0 0/3.4cqw 3.4cqw;opacity:.35}
.tx{position:absolute;z-index:2;right:8cqw;left:8cqw;top:68cqw;text-align:right}
.tx small{display:inline-block;padding:.6cqw 3cqw;border:.4cqw solid var(--ink);border-radius:6cqw;font-size:3.3cqw;font-weight:500}
.tx h2{font:700 8.4cqw/1.35 'Aref Ruqaa','Tajawal',serif;margin:2.4cqw 0 1.6cqw}
.tx p{font-size:4.1cqw;line-height:1.7;font-weight:500}
.w{display:inline-block;position:relative;transition:transform .45s cubic-bezier(.3,1.5,.5,1);will-change:transform}.w.live{transition:transform .09s linear}.tx{touch-action:none}.w.pop{z-index:4;transform:scale(1.28) rotate(-3deg);background:var(--ink);color:var(--c);box-shadow:0 0 0 .9cqw var(--ink);border-radius:1.2cqw}.cover{background:#00323a;--c:#00323a;--ink:var(--cream);text-align:center}
.band{position:absolute;left:0;right:0;height:16cqw;opacity:.55;background:repeating-linear-gradient(45deg,#0b5249 0 .8cqw,transparent .8cqw 1.6cqw),repeating-linear-gradient(-45deg,#0b5249 0 .8cqw,transparent .8cqw 1.6cqw)}
.cover h1{position:absolute;left:6cqw;right:6cqw;top:26cqw;font:700 14cqw/1.3 'Aref Ruqaa','Tajawal',serif;color:var(--cream)}
.cover p{position:absolute;left:6cqw;right:6cqw;top:66cqw;font-size:4.6cqw;line-height:1.6;font-weight:300}
.cover b{position:absolute;left:0;right:0;top:94cqw;margin:auto;width:max-content;padding:1.4cqw 5.4cqw;border-radius:8cqw;background:var(--gold);color:#00221f;font-size:4.6cqw}
.cover i{position:absolute;left:0;right:0;bottom:18cqw;font-style:normal;font-size:3.4cqw;line-height:1.5;opacity:.7}
.bar{display:flex;align-items:center;gap:16px;direction:ltr}
.bar button{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);background:none;color:var(--gold);font-size:28px;cursor:pointer}
.bar span{min-width:90px;text-align:center;font-size:18px;color:var(--cream);direction:rtl}
</style></head><body>

const N=els.length,pvB=document.getElementById('pv'),nxB=document.getElementById('nx');let a=0,busy=false;
function lay(){els.forEach((e,i)=>{const p=i-a;e.style.zIndex=p<0?(p==-1?N+1:i):N-p;e.style.pointerEvents=p?'none':'auto';
if(p<0){e.style.opacity=0;e.style.transform='translateX(-130%) rotate(-16deg)'}else if(p>3){e.style.opacity=0;e.style.transform='translateY(8cqw) scale(.88)'}else{e.style.opacity=1;e.style.transform=p?`translateY(${p*2.4}cqw) scale(${1-p*.035}) rotate(${(p%2?1:-1)*p*1.3}deg)`:'none'}});
ct.textContent=a?`${a.toLocaleString('ar-EG')} / ${(N-1).toLocaleString('ar-EG')}`:'البداية';pvB.style.opacity=a?1:.3;nxB.style.opacity=a<N-1?1:.3}
function next(){if(busy||a>=N-1)return;busy=true;clr();a++;lay();
setTimeout(()=>busy=false,800)}
function prev(){if(busy||a<=0)return;busy=true;clr();a--;lay();setTimeout(()=>busy=false,800)}
let sx=null,t0=0,tg=null;const clr=()=>{let r=0;deck.querySelectorAll('.zoom').forEach(z=>{z.classList.remove('zoom');r=1});return r};
let wave=null;
function waveMove(x,y){const R=deck.offsetWidth*.15,q=deck.offsetWidth/100;let best=null,bd=1e9;wave.forEach(o=>{const d=Math.abs(o.cy-y);if(d<bd){bd=d;best=o.ln}});if(bd>wave[0].h*.9)best=null;
wave.forEach(o=>{if(o.ln!==best){o.w.style.transform='';return}const dx=o.cx-x,k=Math.exp(-(dx/R)*(dx/R)),u=Math.sign(dx);o.w.style.transform=k<.02?'':`translate(${u*k*3*q}px,${-k*3.4*q}px) scale(${1+k*.85})`})}
function waveEnd(){if(wave){wave.forEach(o=>{o.w.classList.remove('live');o.w.style.transform=''});wave=null}}
deck.onpointerdown=e=>{if(busy)return;const t=e.target.closest&&e.target.closest('.tx');if(t&&t.parentNode===els[a]){wave=[...t.querySelectorAll('.w')].map(w=>{const r=w.getBoundingClientRect();return{w,cx:r.left+r.width/2,cy:r.top+r.height/2,h:r.height,ln:w.offsetTop}});wave.forEach(o=>o.w.classList.add('live'));deck.setPointerCapture(e.pointerId);waveMove(e.clientX,e.clientY);return}
sx=e.clientX;t0=e.timeStamp;tg=e.target;deck.setPointerCapture(e.pointerId);els[a].style.transition='none';if(a)els[a-1].style.transition='none'};
deck.onpointermove=e=>{if(wave){waveMove(e.clientX,e.clientY);return}if(sx===null)return;const dx=e.clientX-sx,w=deck.offsetWidth;if(dx<=0||!a){const m=(dx<=0?a<N-1:0)?1:.2,x=dx*m;els[a].style.transform=`translateX(${x}px) rotate(${x/w*18}deg)`}else{const k=Math.min(1,dx/(w*.7)),q=els[a-1];q.style.zIndex=N+1;q.style.opacity=k;q.style.transform=`translateX(${-130*(1-k)}%) rotate(${-16*(1-k)}deg)`}};
deck.onpointerup=e=>{if(wave){waveEnd();return}if(sx===null)return;const dx=e.clientX-sx,w=deck.offsetWidth,v=dx/Math.max(1,e.timeStamp-t0);sx=null;els[a].style.transition='';if(a)els[a-1].style.transition='';
const go=Math.abs(dx)>w*.22||(Math.abs(dx)>24&&Math.abs(v)>.4);if(Math.abs(dx)<8){const z=tg&&tg.closest('.po');if(z){const on=z.classList.contains('zoom');clr();if(!on)z.classList.add('zoom')}else clr()}else if(go&&dx<0)next();else if(go&&dx>0)prev();lay()};
deck.onpointercancel=()=>{waveEnd();if(sx!==null){sx=null;els[a].style.transition='';if(a)els[a-1].style.transition='';lay()}};
document.getElementById('pv').onclick=()=>prev();document.getElementById('nx').onclick=()=>next();
document.onkeydown=e=>{if(e.key=='ArrowLeft'||e.key=='ArrowDown')next();if(e.key=='ArrowRight'||e.key=='ArrowUp')prev()};
lay();
</script></body></html>
